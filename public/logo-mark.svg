<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="EliteTatz mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>EliteTatz mark</title>
  <!-- seal: the artist's stamp of authorship -->
  <circle cx="54" cy="60" r="44" fill="none" stroke="#f5f5f0" stroke-width="6"/>
  <!-- E built from three bars -->
  <rect x="36" y="38" width="30" height="7" fill="#f5f5f0"/>
  <rect x="36" y="75" width="30" height="7" fill="#f5f5f0"/>
  <rect x="36" y="38" width="7" height="44" fill="#f5f5f0"/>
  <!-- middle bar becomes the needle: leaves the seal, lays one line -->
  <rect x="36" y="56.5" width="72" height="7" fill="#c9a84c"/>
  <!-- the single drop of ink: one of one -->
  <circle cx="112" cy="60" r="5" fill="#e85d2f"/>
</svg>
